name: STM32 firmware
on: [push, pull_request]
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi
      - run: cmake --preset stm32-debug
      - run: cmake --build --preset stm32-debug
      - uses: actions/upload-artifact@v4
        with:
          name: stm32-simulation
          path: |
            build/stm32-debug/firmware/stm32/pendulum.elf
            build/stm32-debug/firmware/stm32/pendulum.hex
            build/stm32-debug/firmware/stm32/pendulum.bin
            build/stm32-debug/firmware/stm32/pendulum.map
  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cmake -S simulation/native -B build/host -G Ninja
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/requirements.txt
      - run: PYTHONPATH=experiments/python python -m pytest -q experiments/tests
      - run: python experiments/scripts/plot_v3.py --no-show
